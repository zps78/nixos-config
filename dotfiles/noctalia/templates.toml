[theme.templates]
enable_builtin_templates = true

builtin_ids = [
    "btop",
    "cava",
    "ghostty",
    "gtk3",
    "gtk4",
    "kcolorscheme",
    "niri",
    "qt",
]
# dropped: "helix" (removed from config)
# cava: needs ~/.config/cava/config with [color] theme = "noctalia"
# (provided by modules/apps-user/cava.nix)

enable_community_templates = true

community_ids = [
    "bat",
    "blender",
    "claude-code",
    "darktable",
    "fastfetch",
    "fzf",
    "gimp",
    "lazydocker",
    "obs",
    "prismlauncher",
    "steam",
    "telegram",
    "yazi",
    "zed",
]
# claude-code, obs, prismlauncher: only write a theme file - pick it once
# in the app (Claude Code /config, OBS Settings -> Appearance, Prism
# Settings). lazydocker's apply.sh points ~/.config/lazydocker/config.yml
# at the theme - fine while Home Manager doesn't own that file.
# dropped: "zen-browser" - its apply.sh post-hook rewrites user.js and
# userChrome.css, which Home Manager owns (read-only), so it failed on every
# theme change. Same CSS is rendered by the zen_browser_* user templates
# below instead; the @import lines are in home/niri.nix.
# dropped: "discord" (not in config), "vscode" (using VSCodium; needs the
# NoctaliaTheme extension installed to have any effect)
# dropped: "brave" (needs python3, not installed, plus a one-time manual
# brave://extensions "load unpacked" step) and "chromium-based" (sets the
# BrowserThemeColor managed policy, but that only seeds Chromium's own
# theme generator - it doesn't paint the color directly, so it could
# never match gtk3.css/gtk4.css's literal colors.surface.default.hex
# paint exactly). Use Brave's native GTK theme option instead
# (brave://settings/appearance) - same literal GTK paint as every other
# GTK app, no policy/template needed.

[theme.templates.user.oh_my_posh]
input_path = "templates/oh-my-posh.json"
output_path = "$XDG_CONFIG_HOME/oh-my-posh/quick-term.json"

# Hook-only template (no input/output). On wallpaper/theme change, blur +
# tint the current wallpaper into /var/lib/greeter-wallpaper/login.png so
# the noctalia-greeter login screen matches the lock screen.
[theme.templates.user.greeter_wallpaper]
post_hook = "bash '{{ config_dir }}/hooks/greeter-blur.sh' '{{ image }}' '{{ colors.surface.default.hex }}' '{{ mode }}'"

# Zen Browser colors - the community template's CSS, without its apply.sh
# hook (see the "zen-browser" note above). Files are pinned from upstream in
# home/niri.nix; Zen @imports these outputs from userChrome/userContent.
[theme.templates.user.zen_browser_chrome]
input_path = "templates/zen-userChrome.css"
output_path = "$XDG_CACHE_HOME/noctalia/zen-browser/zen-userChrome.css"

[theme.templates.user.zen_browser_content]
input_path = "templates/zen-userContent.css"
output_path = "$XDG_CACHE_HOME/noctalia/zen-browser/zen-userContent.css"
